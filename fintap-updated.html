  <div id="__bundler_loading">Unpacking...</div>

  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

13px; color: var(--fg); } .da-form input:focus { border-color: var(--accent); outline: none; }\n.da-send { width: 38px; height: 38px; border-radius: 50%; border: 0; cursor: pointer; background: linear-gradient(135deg, #6b21a8, #2563eb); color: #fff; display: grid; place-items: center; flex: none; } .da-send:hover { filter: brightness(1.1); }\n.da-help { padding: 7px 12px 10px; background: var(--surface); text-align: center; font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); flex: none; } .da-help span:first-child { font-weight: 600; color: var(--fg); } .da-help a { color: var(--accent); font-weight: 600; text-decoration: none; white-space: nowrap; } .da-help a:hover { text-decoration: underline; } .da-help i { font-style: normal; margin: 0 2px; }\n.da-pickrow { position: relative; padding: 8px 12px 0; background: var(--surface); border-top: 1px solid var(--line); flex: none; }\n.da-pickrow + .da-form { border-top: 0; padding-top: 8px; }\n.da-trig { width: 100%; display: flex; align-items: center; gap: 9px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 12px; background: var(--bg); color: var(--fg); font: inherit; font-size: 13px; font-weight: 500; cursor: pointer; text-align: left; } .da-trig:hover, .da-trig[aria-expanded=\"true\"] { border-color: var(--accent); background: var(--accent-soft); }\n.da-trig svg:first-child { color: var(--accent); flex: none; } .da-trig span { flex: 1; } .da-trig em { font-style: normal; font-size: 11px; font-weight: 600; color: var(--accent); background: var(--accent-soft); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; } .da-trig .chev { color: var(--muted); transition: transform .18s; } .da-trig[aria-expanded=\"true\"] .chev { transform: rotate(180deg); }\n.da-pick.on { background: var(--accent-soft); border-color: var(--accent); }\n.da-menu { position: absolute; left: 8px; right: 8px; bottom: calc(100% + 4px); max-height: min(340px, 48vh); display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 18px 40px -12px rgba(60, 20, 110, .35); overflow: hidden; z-index: 3; animation: daPop .16s ease-out; }\n@keyframes daPop { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }\n@media (prefers-reduced-motion: reduce) { .da-menu { animation: none; } .da-trig .chev { transition: none; } }\n.da-tabs { display: flex; gap: 6px; padding: 10px 10px 8px; overflow-x: auto; flex: none; scrollbar-width: none; } .da-tabs::-webkit-scrollbar { display: none; }\n.da-tab { border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 999px; padding: 5px 11px; font: inherit; font-size: 12px; font-weight: 500; white-space: nowrap; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; } .da-tab:hover { border-color: var(--c); }\n.da-tab i { width: 7px; height: 7px; border-radius: 50%; background: var(--c); } .da-tab[aria-selected=\"true\"] { background: var(--c); border-color: var(--c); color: #fff; } .da-tab[aria-selected=\"true\"] i { background: #fff; }\n.da-findw { display: flex; align-items: center; gap: 7px; margin: 0 10px 6px; padding: 0 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); color: var(--muted); flex: none; } .da-findw:focus-within { border-color: var(--accent); }\n.da-find { flex: 1; min-width: 0; border: 0; background: transparent; padding: 8px 0; font: inherit; font-size: 13px; color: var(--fg); outline: none; }\n.da-list { overflow-y: auto; padding: 2px 6px 8px; display: flex; flex-direction: column; gap: 2px; }\n.da-item { display: flex; align-items: center; gap: 10px; width: 100%; border: 0; background: transparent; color: var(--fg); font: inherit; font-size: 13px; text-align: left; padding: 8px 8px; border-radius: 10px; cursor: pointer; } .da-item:hover, .da-item:focus-visible { background: var(--accent-soft); outline: none; }\n.da-dot { width: 26px; height: 26px; border-radius: 8px; display: grid; place-items: center; flex: none; font-size: 11px; font-weight: 700; color: var(--c); background: color-mix(in srgb, var(--c) 15%, transparent); }\n.da-it { flex: 1; line-height: 1.3; } .da-mod { font-size: 10.5px; color: var(--c); font-weight: 600; white-space: nowrap; } .da-item .go { color: var(--muted); flex: none; opacity: 0; transition: opacity .12s; } .da-item:hover .go, .da-item:focus-visible .go { opacity: 1; }\n.da-none { padding: 14px 12px; text-align: center; color: var(--muted); font-size: 12.5px; }\n.da-m.bot p { white-space: pre-line; } .da-tag { font-size: 10.5px; text-transform: uppercase; letter-spacing: .05em; color: var(--accent); font-weight: 600; margin-bottom: 3px; } .da-q { font-weight: 600; margin-bottom: 5px; }\n.da-m.typing { display: flex; gap: 4px; padding: 12px 14px; } .da-m.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--muted); }\n@media (prefers-reduced-motion: no-preference) { .da-m.typing i { animation: dadot 1s infinite ease-in-out; } .da-m.typing i:nth-child(2) { animation-delay: .15s; } .da-m.typing i:nth-child(3) { animation-delay: .3s; } @keyframes dadot { 50% { transform: translateY(-4px); opacity: .4; } } .da-panel { animation: dain .18s ease-out; } @keyframes dain { from { transform: translateY(12px); opacity: .5; } } }\n<\u002Fstyle>\n<script>\n(function () {\n  \"use strict\";\n  if (window.__deskAssistant) return; window.__deskAssistant = true;\n\n  /* ===== EDIT HERE: name, helpline and email shown in the widget ===== */\n  var CFG = {\n    theme: \"light\",                  /* \"light\" (default), \"dark\", or \"auto\" to follow the visitor's device */\n    name: \"Desk Assistant\",\n    subtitle: \"Ask a question from the FAQ\",\n    phone: \"0124-4993 100\",          /* text shown to the user */\n    tel: \"+911244993100\",            /* number used by the call link */\n    email: \"ccare@fiaglobal.com\",\n    greeting: \"Hi! Ask about the portal and your account (searching transactions, reports, profile), DigiGold, PMT, IME or Mobile & DTH recharge, or browse the list below. For example:\",\n    examples: [\"How do I search by transaction ID?\", \"How do I filter by date?\", \"How do I find a service type?\"]\n  };\n\n  /* ===== FAQ content: add or edit entries as [module, question, answer, keywords] ===== */\n  var FAQ = [\n    [\"DigiGold\", \"How do I find or register a customer?\", \"Open Services > Digi Gold Transaction, enter the customer's mobile number and click Find. A registered customer's details, gold and silver balance and KYC status are shown. If the number is not registered, the KYC registration form opens.\", \"find search register new customer mobile number lookup\"],\n    [\"DigiGold\", \"What details are needed to register a new customer?\", \"- KYC details: Address Proof type and number (Verify Aadhaar), ID Proof type and number (Validate PAN)\\n- Customer details: name, date of birth, father's or mother's name, mobile, email, marital status, gender, nationality\\n- Billing and delivery addresses\\n- Payout details: Bank Account or UPI\\nClick Submit once the mandatory fields are filled.\", \"registration details required documents aadhaar pan fields mandatory register\"],\n    [\"DigiGold\", \"Can the customer be paid out by UPI as well as bank account?\", \"Yes. Choose either the Bank Account or UPI Account option under Bank Details. A bank account needs the account type, number, IFSC (use Get Bank Details), bank, branch, city and MICR, then Validate Bank Account.\", \"upi bank account payout ifsc micr validate\"],\n    [\"DigiGold\", \"What happens after I submit the registration?\", \"Search the number again. The customer shows with KYC Status Pending. Click Send OTP to validate the customer's mobile number.\", \"after submit registration pending otp validate mobile\"],\n    [\"DigiGold\", \"Why is the Transact button missing?\", \"Transact appears only when KYC Status is Verified. While the status is Pending (manual verification) or Rejected, it stays hidden.\", \"transact button missing hidden not showing kyc status verified\"],\n    [\"DigiGold\", \"When does an admin need to verify KYC?\", \"Only for manual verification cases, where the PAN name and the bank or UPI account name do not match. If Aadhaar, PAN and bank or UPI details are auto-verified, the status becomes Verified with no admin action.\", \"admin verify kyc manual verification name mismatch auto verified\"],\n    [\"DigiGold\", \"How does the admin approve or reject KYC?\", \"On the DigiGold Customer KYC screen, filter by Member User Type, Member User and Status, or search by customer name or mobile. The admin reviews the Address Proof ID, address proof, ID proof, bank account number, account holder's name and bank statement, then marks the request Verified or Reject for resubmit, optionally with a reason.\", \"admin approve kyc review verified resubmit reason\"],\n    [\"DigiGold\", \"My customer's KYC was rejected. What now?\", \"The status shows Rejected with a KYC Comment giving the reason. Search the customer again, click Find, then Edit, correct the details and resubmit. The status returns to Pending for the admin to review again.\", \"kyc rejected reject comment edit resubmit correct\"],\n    [\"DigiGold\", \"What can a new customer do first?\", \"Buy only. When the gold and silver balance is zero, Sell and Redeem stay disabled until a Buy creates a balance. After that, Sell and Redeem can be done as many times as needed while a balance exists.\", \"new customer first buy sell redeem disabled zero balance\"],\n    [\"DigiGold\", \"How do I do a Buy?\", \"1. Click Transact, then select the metal (Gold or Silver) and Buy.\\n2. Enter the quantity by Amount or by Gram.\\n3. Click Compute Actual to get a live quote with taxes and total.\\n4. Check the billing address (you can edit or add one).\\n5. Click Proceed to Buy.\\nA Tax Invoice is generated at once and the grams are added to the customer's balance immediately.\", \"buy purchase gold silver quote compute actual proceed invoice\"],\n    [\"DigiGold\", \"How long is a quote valid?\", \"Every Buy, Sell and Redeem quote is valid for a 5-minute countdown. Complete the transaction in that time or fetch a fresh quote.\", \"quote valid validity countdown minutes expire timer\"],\n    [\"DigiGold\", \"Can I switch between Buy, Sell and Redeem without starting over?\", \"Yes. Use Change Transaction Type on the quote page.\", \"switch change transaction type buy sell redeem\"],\n    [\"DigiGold\", \"How does a Sell work, and when does the customer get paid?\", \"Enter the quantity, click Compute Actual, then Proceed to Sell. The sold grams are deducted from the balance right away and a Temporary Tax Invoice is generated with Payment Status Processing. Payout is instant to a UPI ID, or within 1-48 hours to a bank account.\", \"sell payout paid time hours instant processing temporary invoice\"],\n    [\"DigiGold\", \"How do I check whether the payout has been credited?\", \"Open the DigiGold Transaction Report (available to Admin and agents). It lists each transaction's Status (Completed or In-progress) and PayOut Status (processed or processing), with a Check Status action and an Invoice link.\", \"check payout credited status report completed in-progress processed\"],\n    [\"DigiGold\", \"What is the difference between the Temporary and the Original invoice?\", \"The Temporary Invoice is issued at the time of Sell while payout is processing. After the payout is credited, the agent can retrieve the Original Invoice from the report and hand it to the customer.\", \"temporary original invoice difference tax invoice\"],\n    [\"DigiGold\", \"How does Redeem (physical delivery) work?\", \"1. Select the metal and Redeem, then pick the product.\\n2. Choose the quantity by Amount or Gram and click Add Cart.\\n3. Select a billing address and a delivery address.\\n4. Click Get Redeem Quote to see making and delivery charges, taxes and the grand total.\\n5. Click Proceed to Redeem.\\nA Tax Invoice is generated and the redeemed grams are deducted from the balance immediately.\", \"redeem physical delivery coin bar product cart making charges\"],\n    [\"DigiGold\", \"On which transactions is commission paid, and how much?\", \"- Applies to: Buy transactions only (not Sell or Redeem)\\n- Commission value: 0.0140 x transaction amount\\n- Agent share: 50% of the commission value\\n- Distributor share: 10% of the commission value\\n- TDS: 5% if the customer's profile has a PAN; 20% if not\", \"commission earn percent share agent distributor tds tax pan\"],\n    [\"DigiGold\", \"Who sees which DigiGold reports?\", \"- DigiGold Reports (all transactions): Admin and agents\\n- DigiGold Customer KYC menu: Admin only\\n- Recon, summary and settlement reports: FIA recon admin team\\n- Mail Master Configuration: sets who receives reconciliation alerts and manual KYC notifications\", \"reports access who sees permission admin recon settlement mail master\"],\n\n    [\"PMT\", \"What is new in PMT agent onboarding?\", \"New agents can now onboard through the Billpay Application with minimal inputs. Completely new agents must give their full details and reach their profile page only after that. Agents already physically verified by FIA go straight to their profile page by entering their registered mobile number.\", \"new agent onboarding pmt billpay what changed verified\"],\n    [\"PMT\", \"What checks happen at onboarding?\", \"New agents:\\n1. Branch creation\\n2. RBL verification and biometric E-KYC\\n3. PAN validation with profile name and RBL submission\\n4. RBL OTP consent and agent consent\\nPhysically verified agents skip branch creation and do steps 2 to 4 as 1 to 3.\", \"checks onboarding steps branch rbl pan validation consent verified agents\"],\n    [\"PMT\", \"How do I start agent onboarding?\", \"Log in to Agent Billpay and open Services > PMT CSP Onboarding. The registered mobile number is fetched; click Search, then enter the agent details, verify the OTP and submit.\", \"start agent onboarding csp menu login search otp\"],\n    [\"PMT\", \"What are the steps after submitting the details?\", \"1. On the Agent profile (status Pending), click E-kyc. Allow pop-ups for the URL in your browser.\\n2. On the RBL page, verify the Aadhaar details and date of birth, then click Close.\\n3. Back on the Billpay biometric page, select the device and capture the fingerprint, then click Submit E-KYC.\\n4. Do the final submit of the CSP details and click OK on the pop-up.\\n5. On the RBL pop-up, complete the OTP, tick the consent box and click Submit, then close the window.\\n6. Click Submit Agent Consent. The message 'Agent Onboarded Successfully' confirms the agent is onboarded in the RBL system.\", \"steps after submit ekyc e-kyc popup biometric fingerprint rbl consent onboarded successfully\"],\n    [\"PMT\", \"What if I click the onboarding menu again?\", \"The message 'Agent already Onboarded' is shown.\", \"onboarding again already onboarded message twice\"],\n    [\"PMT\", \"Which agents cannot be onboarded?\", \"- An agent with a single name and no last name. The bank requires a last name; a request has been raised with the bank.\\n- An agent already onboarded through another distributor. The Bank API returns a 'Duplicate Aadhaar' error on submit, and PMT advises checking this with the agent.\", \"cannot onboard agent single name last name duplicate aadhaar another distributor error\"],\n    [\"PMT\", \"How do I search for a customer?\", \"Open Indo-Nepal Remittance > PMT Transaction, choose Mobile Number or Citizenship / Passport No., enter it and click Find Customer. If the customer is not registered, you are taken to the registration page.\", \"search find customer pmt transaction mobile citizenship passport\"],\n    [\"PMT\", \"Which IDs can a customer register with?\", \"- Passport: passport number and citizenship number\\n- Citizenship: citizenship number\\n- Aadhar Card: Aadhar number\\nSubmit the details and complete the OTP verification.\", \"id types register customer passport citizenship aadhar aadhaar identity documents\"],\n    [\"PMT\", \"How is KYC done for an Aadhar customer?\", \"After the profile is created, click Start eKYC. Complete the Aadhaar verification in the RBL pop-up and wait for success, click Capture Fingerprint (Mantra or Morpho devices are detected automatically), then submit onboarding. The manual says this KYC flow is unchanged from before.\", \"kyc aadhar aadhaar customer ekyc fingerprint mantra morpho\"],\n    [\"PMT\", \"How is KYC done for a Passport or Citizenship customer?\", \"Upload the Front ID image, Back ID image and a Customer Holding ID photo (maximum 2 MB per image). PMT reviews the documents and approves or rejects them. While under review, click Refresh Status to see the latest status.\", \"kyc passport citizenship customer upload front back image holding photo 2 mb refresh status\"],\n    [\"PMT\", \"When can I add a beneficiary?\", \"Once the customer's KYC is complete. Click Add Receiver in the customer profile, fill in the receiver details and click Create Receiver. The receiver then appears in the receiver list.\", \"add beneficiary receiver create pmt when\"],\n    [\"PMT\", \"How do I send a transaction?\", \"Click Send against the receiver, enter the amount, and select the remittance reason and source of funds. Click Calculate Charges to see the charge summary (transfer amount, service charge, total collection, exchange rate and payout amount).\", \"send transaction remittance amount reason source funds calculate charges\"],\n    [\"PMT\", \"What verification is needed to complete the transaction?\", \"The customer's OTP. Click Send OTP, enter it, click Send Transaction, and enter the transaction password when prompted. A message confirms the transaction executed successfully.\", \"verification otp transaction password complete send\"],\n    [\"PMT\", \"Can I print a receipt for the customer?\", \"Yes. The receipt appears on the same screen after a successful transaction and can be printed.\", \"print receipt customer slip\"],\n\n    [\"IME\", \"How has IME agent onboarding changed?\", \"Onboarding used to be document based only. Now every new agent follows E-KYC onboarding only.\", \"ime agent onboarding changed document based ekyc\"],\n    [\"IME\", \"What is the agent onboarding process?\", \"1. Fill in the basic details on the Agent OnBoarding form and submit.\\n2. IME verifies the details.\\n3. Complete Aadhaar E-KYC through RBL.\\n4. Capture the agent's fingerprint.\\n5. Once verified, onboard customers, add beneficiaries and do transactions.\", \"ime agent onboarding process steps\"],\n    [\"IME\", \"What does the Agent OnBoarding form ask for?\", \"Sections for Company Profile, Contact Person Detail, Bank Detail, Device Details, Business Hours and Owner Detail. Fields marked with a red asterisk (*) are mandatory.\", \"agent onboarding form fields sections company profile contact bank device business hours owner mandatory asterisk\"],\n    [\"IME\", \"How does an agent start E-KYC?\", \"From the Customer Search screen or the Agent OnBoarding screen. An agent without E-KYC sees 'This agent can onboard only document-based customers. Complete your e-KYC first to onboard e-KYC customers.'\\n1. Click Complete Agent eKYC Onboarding (for Aadhaar).\\n2. Click Generate OTT / Open URL to reach the RBL page.\\n3. Complete the Aadhaar authentication and submit.\\n4. A Unique ID is generated.\", \"start agent ekyc e-kyc ott generate url unique id complete onboarding\"],\n    [\"IME\", \"Why does the process stop at the RBL step?\", \"Geo-location must be ON in the browser. The process cannot continue if location permission is denied.\", \"stop rbl step geo location permission browser denied stuck\"],\n    [\"IME\", \"How is the agent's fingerprint captured?\", \"After the Unique ID is generated, click Capture Fingerprint, capture it on the biometric device and continue the Unique ID / BioKYC step to submit it for verification.\", \"agent fingerprint capture biometric device biokyc unique id\"],\n    [\"IME\", \"What is the Final CSP onboarding step?\", \"The agent enters bank and business settlement details, all mandatory:\\n- Account Number, Account Name, IFSC Code\\n- Bank Name (select from the dropdown)\\n- Branch Name, Institute Name\\n- Date of Passing (format DD/MM/YYYY)\\n- Transactions / Day, Transfer Amount / Day\\nUse Refresh Status on the Agent eKYC Overview screen to update progress. The manual's screenshot for this step is cut off, so any further fields and the success message are not yet documented.\", \"final csp onboarding step bank settlement account ifsc date of passing limit per day refresh status\"],\n    [\"IME\", \"I was onboarded earlier through documents. What can I do?\", \"You can onboard only Document-Based customers. To onboard Aadhaar-based customers, complete your own E-KYC onboarding first. E-KYC-enabled agents can onboard both types.\", \"onboarded earlier documents document based customers aadhaar ekyc enabled\"],\n    [\"IME\", \"What are the two customer onboarding types?\", \"- Document-Based: uses physical customer documents for verification (existing process)\\n- E-KYC Based: uses Aadhaar authentication, UIDAI verification and biometric validation to create the profile digitally\", \"customer onboarding types document based ekyc based difference\"],\n    [\"IME\", \"How do I onboard a customer with E-KYC?\", \"1. Go to Indo Nepal Remittance > IME Forex Transaction, enter the mobile number or customer identifier and click Find.\\n2. For a new customer, enter basic information, address and Aadhaar details, complete the OTP authentication and submit.\\n3. Click Generate OTT, complete Aadhaar authentication on the RBL page and submit.\\n4. The Unique ID is generated automatically in IME; if not, click Get Unique ID.\\n5. Initiate BioKYC, capture the customer's fingerprint and submit.\\n6. The customer profile is created.\", \"onboard customer ekyc ime forex transaction ott unique id biokyc fingerprint profile\"],\n    [\"IME\", \"When can the customer transact?\", \"After BioKYC succeeds and at least one receiver has been added.\", \"customer transact when allowed biokyc receiver\"],\n    [\"IME\", \"How do I add a beneficiary in IME?\", \"In the customer profile, click Add New Receiver, enter the receiver details and submit. A new customer's receiver list shows 'No Record Found' until a receiver is added. IME-specific screens for this step are still to be added to the manual.\", \"add beneficiary receiver ime new receiver no record found\"],\n    [\"IME\", \"How does an IME transaction work?\", \"The manual says it follows the PMT flow: select the receiver and click Send, enter the amount and select the remittance reason and source of funds, click Calculate Charges, verify the customer's OTP, then print the receipt if needed. IME screenshots for these steps were not provided, so confirm the wording against the live screens.\", \"ime transaction work send remittance flow calculate charges otp receipt\"],\n\n    [\"Mobile & DTH\", \"How is the recharge paid for?\", \"From the agent wallet. The amount is debited when you click Recharge, so there is no separate payment step.\", \"recharge paid payment wallet debit how pay\"],\n    [\"Mobile & DTH\", \"What do I need before starting a recharge?\", \"- A login to the Indicore portal\\n- A wallet balance at least equal to the recharge amount\\n- The customer's mobile number (or DTH subscriber ID) and the amount or plan\", \"need before starting recharge requirements prerequisites login wallet balance\"],\n    [\"Mobile & DTH\", \"Where is the recharge screen?\", \"Log in, open the Recharge menu on the Home page, and the MOBILE / DTH screen opens with a Mobile tab and a DTH tab.\", \"recharge screen menu where find home tab\"],\n    [\"Mobile & DTH\", \"Which fields are mandatory in the recharge form?\", \"- Mobile No (mandatory): 10-digit number to recharge\\n- Circle (mandatory): telecom circle, from the dropdown\\n- Amount (mandatory): in Rs.; typed or auto-filled from a plan\\n- Referral Agent Code (optional): code of the referring agent, if any\", \"mandatory fields recharge form mobile no circle amount referral agent code\"],\n    [\"Mobile & DTH\", \"How do I do a mobile recharge?\", \"1. Keep the Mobile tab selected.\\n2. Enter the 10-digit mobile number.\\n3. Check the Circle. It is often picked up automatically once the number is entered; otherwise select it from the dropdown.\\n4. Click Get Plan to choose a plan, or type the Amount.\\n5. Optionally enter a Referral Agent Code.\\n6. Check the number, circle and amount, then click Recharge.\\n7. Confirm the success or failure message and the updated wallet balance.\", \"mobile recharge how steps prepaid do\"],\n    [\"Mobile & DTH\", \"How do I pick a plan?\", \"1. Click Get Plan after entering the number and circle.\\n2. In the Recharge Plans pop-up, open the relevant category tab (Popular Plans is the default).\\n3. Read the benefits and validity, then click the radio button in the Action column.\\n4. The pop-up closes and the amount fills in automatically.\\n5. Click Recharge.\\nClick the red X to close the pop-up without choosing a plan.\", \"pick plan choose get plan popup category popular radio button action validity benefits\"],\n    [\"Mobile & DTH\", \"How do I do a DTH recharge?\", \"1. Click the DTH tab.\\n2. Select the DTH operator, if the field is shown.\\n3. Enter the DTH subscriber ID or registered mobile number and the Amount.\\n4. Add the optional Referral Agent Code and click Recharge.\\nExact DTH field names may vary by operator, so confirm against the live DTH screen.\", \"dth recharge how steps subscriber id operator dish tv\"],\n    [\"Mobile & DTH\", \"Can I cancel a recharge?\", \"Only before you click Recharge: Cancel clears the form. After Recharge is clicked, it cannot be cancelled from this screen.\", \"cancel recharge stop undo clear form\"],\n    [\"Mobile & DTH\", \"I recharged the wrong number. Can it be reversed?\", \"No, not by the agent. Double-check the number or DTH ID before clicking Recharge.\", \"wrong number recharged reverse reversal mistake refund wrong\"],\n    [\"Mobile & DTH\", \"Can I click Recharge again if nothing seems to happen?\", \"No. Wait for the status message, because repeated clicks can cause duplicate transactions.\", \"click recharge again nothing happens duplicate double wait hang slow\"],\n    [\"Mobile & DTH\", \"What if the recharge fails?\", \"The amount should be reversed to the wallet as per the portal's refund process. Check the status in the transaction report, and contact support if the wallet was debited without a successful recharge.\", \"recharge fails failed failure refund reversed wallet debited support\"],\n    [\"Mobile & DTH\", \"What are the common recharge problems and fixes?\", \"- Plans do not load after Get Plan: number or circle missing or wrong. Re-enter the number and select the correct circle.\\n- Amount field not filling: no plan selected. Click the radio button in the Action column.\\n- Recharge not processed: insufficient wallet balance. Top up the agent wallet and retry.\\n- Recharge failed: operator or network issue. Check the transaction report; contact support if the wallet was debited.\", \"common problems issues fixes troubleshooting plans not load amount not filling not processed insufficient balance\"],\n    [\"Mobile & DTH\", \"Where can I check the wallet debit and recharge details?\", \"In the wallet statement or transaction report. Keep the transaction reference for customer queries.\", \"check wallet debit recharge details statement transaction report reference\"],\n    [\"Mobile & DTH\", \"Who do I contact for recharge help?\", \"The Indicore support team. Share the transaction ID, mobile number or DTH ID, amount and date of the transaction.\", \"contact help support indicore team who call\"],\n\n    [\"Portal & Account\", \"How do I search a transaction by Transaction ID?\", \"Two ways:\\n1. Dashboard > My transactions: type the ID (for example 2007533) or the reference number in the Search ID or reference box. The table filters as you type.\\n2. Reports > Transaction Reports: enter the number in the Transaction ID field, then click View.\", \"search find transaction id txn id number reference lookup dashboard my transactions report\"],\n    [\"Portal & Account\", \"How do I search by reference number?\", \"On the Dashboard, type the reference number in the Search ID or reference box above the My transactions table. It matches either the Txn ID or the reference. In Mobile/DTH Reports, the reference is also shown in the Ref. no. column.\", \"search reference ref number ref no find lookup transaction\"],\n    [\"Portal & Account\", \"How do I find transactions for a particular date or period?\", \"- Dashboard: use the Today, 7 days, 30 days or This month buttons. The date range is shown beside them.\\n- Reports > Transaction Reports: enter a From date (mandatory) and a To date, then click View.\\n- Recharge > Track/Complaint: enter From date and To date, then click Search.\\nThe Date & time column in the table shows when each transaction happened.\", \"date period range today 7 days 30 days month from to filter find transactions by date calendar\"],\n    [\"Portal & Account\", \"Can I search by customer name?\", \"The transaction tables do not have a name search. Use these instead:\\n- Transaction ID or reference: Dashboard search box\\n- Customer mobile number: Recharge > Track/Complaint (Mobile number field), DigiGold (Find), PMT (Find Customer by mobile number or Citizenship / Passport no.), IME (Find)\\n- Service and status filters to narrow a long list\\nThe Created by column in Mobile/DTH Reports shows which agent made the transaction.\", \"search name customer name agent name find by name person lookup who\"],\n    [\"Portal & Account\", \"How do I filter by service type?\", \"- Dashboard: use the Service dropdown above the table (Indo Nepal Remittance PMT or IME, SBI General Insurance Health, Mobile / DTH Recharge, Digital Gold / Silver, BBPS), or click a service card under Live services. Click the card again to clear it.\\n- Reports > Transaction Reports: pick a Service type (Remittance, Recharge, Insurance) and then a Service.\", \"filter service type service dropdown remittance recharge insurance gold bbps live services card\"],\n    [\"Portal & Account\", \"How do I filter by status (Success, Pending or Failed)?\", \"On the Dashboard, use the Status dropdown above the table. In Reports and Track/Complaint, use the Status field and click View or Search. The coloured tags show Success (green), Pending (amber) and Failed (red).\", \"filter status success pending failed green amber red tag\"],\n    [\"Portal & Account\", \"Can I combine search, date, service and status filters?\", \"Yes. On the Dashboard the date range, Service, Status and search box all work together. For example, choose 7 days, Mobile / DTH Recharge, Failed and type part of an ID. Click Reset to return to the 30-day view with no other filters.\", \"combine filters together multiple search date service status reset narrow\"],\n    [\"Portal & Account\", \"How do I clear my filters?\", \"Click Reset beside the date range on the Dashboard. It sets the range to 30 days and clears the Service, Status and search filters.\", \"reset clear filters remove default\"],\n    [\"Portal & Account\", \"How do I export transactions?\", \"On the Dashboard, click Export CSV above the My transactions table. Set your filters first so the file holds only what you need.\", \"export csv download excel save transactions list\"],\n    [\"Portal & Account\", \"Where can I see the full transaction report?\", \"Open Reports > Transaction Reports, or click Full report on the Dashboard. Choose the filters (Service type, Service, Status, Transaction ID, From date, To date) and click View.\", \"full report transaction reports reports menu view all\"],\n    [\"Portal & Account\", \"Why does the report show nothing?\", \"The table stays empty until you click View. Make sure the From date is filled (it is mandatory) and the date range is wide enough. On the Dashboard, try a longer range such as 30 days and click Reset to clear filters.\", \"report empty nothing no data blank no transactions not showing view\"],\n    [\"Portal & Account\", \"What do the Dashboard totals and Success % mean?\", \"- Total transaction value: the sum of all transactions in the chosen date range\\n- Success, Pending, Failed: counts of each status\\n- Success %: successful transactions divided by all transactions in the range\\n- Total (Success) row under the table: the amount of successful transactions in the filtered view\", \"dashboard totals total value success percent success % count amount meaning calculated\"],\n    [\"Portal & Account\", \"How do I check a recharge status or download its receipt?\", \"Open Recharge > Track/Complaint, enter the dates and click Search. In the row, click Update status to refresh it, or View under Receipt to open and print the receipt.\", \"recharge status receipt print track update status view receipt\"],\n    [\"Portal & Account\", \"How do I find a recharge by mobile number?\", \"Open Recharge > Track/Complaint, enter the Mobile number along with From and To dates, choose a Status if you wish, and click Search.\", \"find recharge mobile number track search report dth\"],\n    [\"Portal & Account\", \"How do I raise a complaint on a transaction?\", \"Open Recharge > Track/Complaint, search for the transaction and click Raise complaint in its row. Choose what went wrong, add details and submit. For other services, call or email the helpline from Support > Contact Us.\", \"raise complaint dispute problem transaction issue support ticket\"],\n    [\"Portal & Account\", \"Where do I see my SSO ID, kiosk code and agent code?\", \"On the Dashboard, under the heading. They are also in My Profile, opened from your name at the top right.\", \"sso id kiosk code agent code where see details dashboard profile\"],\n    [\"Portal & Account\", \"Can I edit my profile details?\", \"No. My Profile is read-only. The details come from your e-Mitra registration. Contact the helpline if something needs correcting.\", \"edit profile change details name mobile pan update read only\"],\n    [\"Portal & Account\", \"How do I set or change the transaction password?\", \"Click your name at the top right > Set Transaction Password. Enter the new password twice and click Save password. Use at least 6 characters, make sure both entries match and avoid your mobile number or date of birth. Do not share it.\", \"transaction password set change create pin forgot account menu security\"],\n    [\"Portal & Account\", \"How do I switch between English and Hindi?\", \"Use the English / हिंदी switch at the top right of any page. The User Guide also has its own English and Hindi buttons.\", \"language hindi english switch change translate\"],\n    [\"Portal & Account\", \"How do I log out or go back to e-Mitra?\", \"Click your name at the top right, then choose Return to e-Mitra to continue on e-Mitra, or Logout to sign out. On a shared kiosk, always log out before leaving.\", \"logout log out sign out return emitra e-mitra exit leave shared kiosk\"],\n    [\"Portal & Account\", \"How do I open FinTap from e-Mitra?\", \"Select the FinTap / BillPay service on e-Mitra. You land on the Dashboard with your SSO ID and kiosk code. Do not use the FIA agent login.\", \"open fintap emitra e-mitra login how to enter billpay sso fia agent login\"],\n    [\"Portal & Account\", \"Why does PMT or IME show Onboarding pending?\", \"The agent onboarding for that service is not complete. Open the service from Product > Indo Nepal Remittance, or use Onboard PMT or Onboard IME on the Dashboard, fill the form and verify with the OTP.\", \"onboarding pending pmt ime why warning complete onboard dashboard needs attention\"],\n    [\"Portal & Account\", \"Where are the user manuals and video tutorials?\", \"Open Support > User Guide. Each service has its PDF manual and a video. The Home page product cards also have User manual and Video tutorial buttons.\", \"user manual guide video tutorial pdf download training help where\"],\n    [\"Portal & Account\", \"Who do I contact for portal or account problems?\", \"Call the helpline or email ccare@fiaglobal.com. Support > Contact Us has both, with a Copy email button.\", \"contact portal account problem helpline email support login access issue\"]\n  ];\n\n  var AISTOP = /^(the|and|for|how|what|can|does|did|are|was|why|when|where|which|who|with|from|this|that|have|has|you|your|will|should|would|could|there|their|they|them|then|than|any|not|but|into|about|please|tell|show|give|need|want|get|let|its|our|out|too|may|use|used|also|just|only|after|before|while|once|each|every|work|works|make|made|many|much|more|most|some|other)$/;\n  function tok(s) { return s.toLowerCase().replace(/[^a-z0-9]+/g, \" \").split(\" \").filter(function (w) { return w.length > 2 && !AISTOP.test(w); }).map(function (w) { return w.length > 4 ? w.replace(/(ing|ed|es|s)$/, \"\") : w.replace(/s$/, \"\"); }); }\n  function set(a) { var o = {}; a.forEach(function (w) { o[w] = 1; }); return o; }\n  FAQ.forEach(function (e) { e.qs = set(tok(e[1])); e.ks = set(tok(e[3])); e.as = set(tok(e[2])); });\n  var AIMOD = { \"Portal & Account\": /portal|dashboard|report|transaction id|\\bfilter|export|\\bcsv\\b|\\bsso\\b|kiosk|e-?mitra|logout|language|hindi|profile|date range/i, \"DigiGold\": /digi\\s*gold|\\bgold\\b|silver|mmtc/i, \"PMT\": /\\bpmt\\b|passport|citizenship|billpay/i, \"IME\": /\\bime\\b/i, \"Mobile & DTH\": /recharge|\\bdth\\b|mobile|indicore|\\bwallet\\b/i };\n  function aiFaq(raw) {\n    var qt
